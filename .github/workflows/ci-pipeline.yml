name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for solution
        id: check
        run: echo "exists=${{ hashFiles('Chatbot.sln') != '' }}" >> $GITHUB_OUTPUT

      - name: Setup .NET 9
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        if: steps.check.outputs.exists == 'true'
        run: dotnet restore Chatbot.sln

      - name: Build solution
        if: steps.check.outputs.exists == 'true'
        run: dotnet build Chatbot.sln --configuration Release --no-restore

      - name: Run tests
        if: steps.check.outputs.exists == 'true'
        run: dotnet test Chatbot.sln --configuration Release --no-build --verbosity normal

      - name: Skipped (no solution yet)
        if: steps.check.outputs.exists != 'true'
        run: echo "Chatbot.sln findes ikke endnu - build og test springes over (se fase 1.2 i BUILD_GUIDE.md)."

  # Fase 6: Vue-frontend i frontend/. Kører parallelt med backend-jobbet.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for frontend
        id: check
        working-directory: .
        run: echo "exists=${{ hashFiles('frontend/package.json') != '' }}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.check.outputs.exists == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build-only

      - name: Skipped (no frontend yet)
        if: steps.check.outputs.exists != 'true'
        working-directory: .
        run: echo "frontend/package.json findes ikke endnu - frontend-jobbet springes over."
